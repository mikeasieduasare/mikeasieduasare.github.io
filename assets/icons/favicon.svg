<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg { fill: #f7f7f3; }
    .ring { fill: none; stroke: #3157d5; stroke-width: 2; }
    .dot { fill: #3157d5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0c0e13; }
      .ring { stroke: #6d8cff; }
      .dot { fill: #6d8cff; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="6"/>
  <ellipse class="ring" cx="15" cy="16" rx="10.5" ry="8.5" transform="rotate(-12 15 16)"/>
  <circle class="dot" cx="21" cy="13" r="3.2"/>
</svg>
